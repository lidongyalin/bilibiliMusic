<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover 让内容延伸到刘海/圆角区域，配合 CSS 的 env(safe-area-inset-*)
      给顶栏和播放条留出安全区。故意不加 user-scalable=no——禁用缩放是无障碍反模式。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 移动浏览器把地址栏染色成应用主背景色 -->
    <meta name="theme-color" content="#121212" />
    <!--
      B 站图片 CDN（hdslb.com）有防盗链：Referer 为空或来自 bilibili.com 才放行，
      来自本地域名的 Referer 一律返回 403 的 HTML 错误页。
      这里声明 no-referrer，让封面图与锁屏元数据不带 Referer 请求。
    -->
    <meta name="referrer" content="no-referrer" />
    <title>B 站音乐播放器</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ec4141' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9 18V7l11-2v11'/%3E%3Ccircle cx='6.5' cy='18' r='2.5'/%3E%3Ccircle cx='17.5' cy='16' r='2.5'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
